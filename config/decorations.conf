# ── Glassmorphism & Visual Decorations ───────────────────────
decoration {
    rounding = 8

    active_opacity   = 0.96
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.1

    blur {
        enabled           = true
        size              = 6
        passes            = 3
        new_optimizations = true
        xray              = false
        ignore_opacity    = true
        vibrancy          = 0.2
        popups            = true
    }

    shadow {
        enabled      = true
        range        = 15
        render_power = 3
        color        = rgba(1a1a1aee)
    }
}
