# Window Decoration Configuration
# Official Docs: https://wiki.hypr.land/Configuring/Variables/#decoration

decoration {
    rounding = 10
    
    # Active/Inactive window transparency (high clarity for text and UI)
    active_opacity = 0.98
    inactive_opacity = 0.94
    fullscreen_opacity = 1.0

    # Subtle inactive window dimming
    dim_inactive = true
    dim_strength = 0.03

    # Fast frosted glass background blur
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        xray = false
        ignore_opacity = true
        vibrancy = 0.1696
        popups = true
    }

    # Soft drop shadows
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1a1a1aee)
        color_inactive = rgba(00000022)
    }
}
