# Animations Configuration
# Official Docs: https://wiki.hypr.land/Configuring/Animations/

animations {
    enabled = true

    # Custom Bezier curve definitions for fluid physics
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.05
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = easeOutBack, 0.34, 1.3, 0.64, 1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = overshot, 0.13, 0.99, 0.29, 1.08

    # Animation mappings (speed, curve, style)
    animation = windows, 1, 4, wind, slide
    animation = windowsIn, 1, 4, winIn, popin 80%
    animation = windowsOut, 1, 3, winOut, popin 80%
    animation = windowsMove, 1, 4, wind, slide
    animation = border, 1, 4, default
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, overshot, slidefade 20%
    animation = specialWorkspace, 1, 4, wind, slidefadevert 20%
}
