# Animations Configuration
# Official Docs: https://wiki.hypr.land/Configuring/Animations/

animations {
    enabled = true

    # Clean physics curves for instant, smooth feedback
    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = smooth, 0.25, 1, 0.5, 1

    # Responsive animation timings
    animation = windows, 1, 3, easeOut, slide
    animation = windowsIn, 1, 3, easeOut, popin 85%
    animation = windowsOut, 1, 2, smooth, popin 85%
    animation = windowsMove, 1, 3, easeOut, slide
    animation = border, 1, 3, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 3, easeOut, slide
    animation = specialWorkspace, 1, 3, easeOut, slidefadevert 20%
}
