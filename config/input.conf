# ── Input Configuration ───────────────────────────────────────
input {
    kb_layout    = us
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll = true
        tap-to-click   = true
    }
}

gestures {
    workspace_swipe_invert         = true
    workspace_swipe_create_new     = true
    workspace_swipe_forever        = false
    workspace_swipe_direction_lock = true
    workspace_swipe_use_r          = false
}

gesture = 3, horizontal, workspace

device {
    name        = epic-mouse-v1
    sensitivity = -0.5
}
