$mainMod = SUPER

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, SPACE, exec, pkill -x wofi || $menu
bind = $mainMod SHIFT, SPACE, exec, pgrep -x waybar && pkill -USR1 waybar || waybar

# Window Control
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, RETURN, fullscreen, 0
bind = $mainMod, T, pseudo

# Focus navigation (Arrow Keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move active window within workspace
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize active window
binde = $mainMod ALT, left, resizeactive, -30 0
binde = $mainMod ALT, right, resizeactive, 30 0
binde = $mainMod ALT, up, resizeactive, 0 -30
binde = $mainMod ALT, down, resizeactive, 0 30


# Screen Shot
# bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

