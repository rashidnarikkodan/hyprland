# Floating Window Rules
# Rules specifically targeting floating windows, helper windows, and tool window configurations

# Fix XWayland drag-and-drop issues
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Hyprland Run prompt location and float
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

# Floating Developer Monitor (btop)
windowrule {
    name = float-btop
    match:class = ^(floating_btop)$
    float = yes
    size = 1000 650
    center = yes
}

# System Utility Dialogs
windowrule {
    name = float-system-dialogs
    match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nwg-look|qt5ct|qt6ct|nm-connection-editor|nm-applet)$
    float = yes
    center = yes
}

windowrule {
    name = float-file-dialogs
    match:title = ^(Open File|Select a File|Choose Files|Save As|Save File|Confirm to replace files|File Operation Progress)$
    float = yes
    center = yes
}

