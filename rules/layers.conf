# Layer Rules
# Official Docs: https://wiki.hypr.land/Configuring/Window-Rules/#layer-rules
# Used for desktop widgets, status bars, and launcher layouts (e.g. waybar, rofi, dunst)

layerrule {
    name = waybar-blur
    match:namespace = waybar
    blur = true
    ignore_alpha = 0.2
}

layerrule {
    name = rofi-blur
    match:namespace = rofi
    blur = true
    ignore_alpha = 0.2
}

layerrule {
    name = swaync-blur
    match:namespace = swaync-control-center
    blur = true
    ignore_alpha = 0.2
}

layerrule {
    name = notifications-blur
    match:namespace = notifications
    blur = true
    ignore_alpha = 0.2
}
