# ── Window Rules ──────────────────────────────────────────────
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:float = true
    match:fullscreen = false
    match:xwayland = true
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    float = yes
    move = 20 monitor_h-120
}

windowrule {
    name = float-btop
    match:class = ^(floating_btop)$
    center = yes
    size = 1000 650
    float = yes
}

windowrule {
    name = float-wiremix
    match:class = ^(floating_wiremix)$
    center = yes
    size = 900 600
    float = yes
}

windowrule {
    name = float-system-dialogs
    match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nwg-look|qt5ct|qt6ct|nm-connection-editor|nm-applet)$
    center = yes
    float = yes
}

windowrule {
    name = float-file-dialogs
    match:title = ^(Open File|Select a File|Choose Files|Save As|Save File|Confirm to replace files|File Operation Progress)$
    center = yes
    float = yes
}

windowrule {
    name = picture-in-picture
    match:title = ^(Picture-in-Picture)$
    float = yes
    pin = yes
}

windowrule {
    name = media-viewers
    match:class = ^(eog|feh|imv|mpv|vlc)$
    center = yes
    float = yes
}

# ── Layer Rules: Walker Application Launcher ──────────────────
layerrule {
    name = walker-launcher
    match:namespace = walker
    dim_around = yes
    animation = popin 85%
}

