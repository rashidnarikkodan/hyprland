# Full screen
bind = , Print, exec, sh -c 'DIR=~/Pictures/Screenshots/$(date +%Y-%m-%d) && mkdir -p "$DIR" && hyprshot -m output -o "$DIR" -f full_$(date +%H%M%S)'

# Window
bind = SUPER, Print, exec, sh -c 'DIR=~/Pictures/Screenshots/$(date +%Y-%m-%d) && mkdir -p "$DIR" && hyprshot -m window -o "$DIR" -f window_$(date +%H%M%S)'

# Region
bind = SUPER SHIFT, Print, exec, sh -c 'DIR=~/Pictures/Screenshots/$(date +%Y-%m-%d) && mkdir -p "$DIR" && hyprshot -m region -o "$DIR" -f region_$(date +%H%M%S)'