# Floating Developer Monitor (btop)
windowrule {
    name = float-btop
    match:class = ^(floating_btop)$
    float = yes
    size = 1000 650
    center = yes
}

# Smart Gaps (No gaps/borders when only one window is tiled)
workspace = w[tv1], gapsout:0, gapsin:0, border:false
workspace = f[1], gapsout:0, gapsin:0, border:false

# Special Workspaces Configuration
workspace = special:dev_scratch, on-created-empty:kitty
