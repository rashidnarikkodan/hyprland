# Main Hyprland Configuration Entrypoint
# Sources all configuration modules in a structured, logical order
# Official Docs: https://wiki.hypr.land/Configuring/

# 1. Environment & Variables
source = ~/.config/hypr/config/env.conf
source = ~/.config/hypr/config/variables.conf

# 2. Hardware / System configuration
source = ~/.config/hypr/config/monitors.conf
source = ~/.config/hypr/config/input.conf

# 3. Look & Feel (Appearance, Decorations, Animations, Layouts)
source = ~/.config/hypr/config/appearance.conf
source = ~/.config/hypr/config/decorations.conf
source = ~/.config/hypr/config/animations.conf
source = ~/.config/hypr/config/layout.conf
source = ~/.config/hypr/config/misc.conf
source = ~/.config/hypr/config/debug.conf

# 4. Keybindings
source = ~/.config/hypr/binds/apps.conf
source = ~/.config/hypr/binds/windows.conf
source = ~/.config/hypr/binds/workspaces.conf
source = ~/.config/hypr/binds/media.conf
source = ~/.config/hypr/binds/mouse.conf
source = ~/.config/hypr/binds/resize.conf
source = ~/.config/hypr/binds/screenshots.conf

# 5. Window / Workspace Rules
source = ~/.config/hypr/rules/windows.conf
source = ~/.config/hypr/rules/floating.conf
source = ~/.config/hypr/rules/workspaces.conf
source = ~/.config/hypr/rules/layers.conf

# 6. Startup/Autostart Services & Apps
source = ~/.config/hypr/startup/services.conf
source = ~/.config/hypr/startup/applications.conf
