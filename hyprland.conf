# ──────────────────────────────────────────────────────────────
#  Hyprland Configuration (Lightweight & Minimal Setup)
# ──────────────────────────────────────────────────────────────

# ── Variables ─────────────────────────────────────────────────
$mainMod     = SUPER
$terminal    = kitty
$fileManager = thunar
$browser     = helium-browser
$browser2    = brave
$browser3    = google-chrome-stable
$launcher    = walker
$menu        = $launcher
$editor      = nano

# ── Environment Variables ─────────────────────────────────────
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,14
env = HYPRCURSOR_SIZE,14
env = PATH,$HOME/.local/bin:/usr/local/bin:/usr/bin
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
env = HYPRLAND_LOG_WLR,0
env = LIBVA_DRIVER_NAME,iHD

# ── Monitors Configuration ────────────────────────────────────
monitor = HDMI-A-2, 1366x768@59.79, 277x0, 1
monitor = eDP-1, 1920x1080@60.01, 0x768, 1

# ── Input Configuration ───────────────────────────────────────
input {
    kb_layout    = us
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll = true
        tap-to-click   = true
    }
}

gestures {
    workspace_swipe_invert         = true
    workspace_swipe_create_new     = true
    workspace_swipe_forever        = false
    workspace_swipe_direction_lock = true
    workspace_swipe_use_r          = false
}

gesture = 3, horizontal, workspace

# ── General Appearance (Minimal & Lightweight) ────────────────
general {
    gaps_in     = 2
    gaps_out    = 2
    border_size = 1

    col.active_border   = rgba(9A6429ee) rgba(C39953ee) 45deg
    col.inactive_border = rgba(9A642933)

    resize_on_border = true
    allow_tearing    = false
    layout           = dwindle
}

# ── Decorations (No Blur, No Shadows) ─────────────────────────
decoration {
    rounding = 0

    active_opacity   = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

# ── Animations (Disabled for maximum performance) ────────────
animations {
    enabled = false
}

# ── Layout Options ────────────────────────────────────────────
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# ── Misc & System Parameters ──────────────────────────────────
misc {
    force_default_wallpaper      = 0
    disable_hyprland_logo        = true
    disable_splash_rendering     = true
    vrr                          = 1
    mouse_move_enables_dpms      = true
    key_press_enables_dpms       = true
    always_follow_on_dnd         = true
    animate_manual_resizes       = false
    animate_mouse_windowdragging = false
    enable_swallow               = true
    swallow_regex                = ^(alacritty|kitty|foot|ghostty)$
    focus_on_activate            = true
    initial_workspace_tracking   = 1
}

cursor {
    no_hardware_cursors      = false
    hide_on_key_press        = true
    warp_on_change_workspace = true
}

render {
    direct_scanout = 1
}

# ── Autostart Services ────────────────────────────────────────
exec-once = uwsm app -- waybar
exec-once = uwsm app -- hyprpaper
exec-once = uwsm app -- wl-paste --type text  --watch cliphist store
exec-once = uwsm app -- wl-paste --type image --watch cliphist store
exec-once = systemctl --user start elephant.service walker.service

# ── Window & Layer Rules ──────────────────────────────────────
windowrule = suppress_event maximize, class:.*
windowrule = no_focus, title:^$, class:^$, floating:1, fullscreen:0, xwayland:1, pinned:0
windowrule = float, class:hyprland-run
windowrule = move 20 monitor_h-120, class:hyprland-run
windowrule = float, class:^(floating_btop)$
windowrule = center, class:^(floating_btop)$
windowrule = size 1000 650, class:^(floating_btop)$
windowrule = float, class:^(floating_wiremix)$
windowrule = center, class:^(floating_wiremix)$
windowrule = size 900 600, class:^(floating_wiremix)$
windowrule = float, class:^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nwg-look|qt5ct|qt6ct|nm-connection-editor|nm-applet)$
windowrule = center, class:^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nwg-look|qt5ct|qt6ct|nm-connection-editor|nm-applet)$
windowrule = float, title:^(Open File|Select a File|Choose Files|Save As|Save File|Confirm to replace files|File Operation Progress)$
windowrule = center, title:^(Open File|Select a File|Choose Files|Save As|Save File|Confirm to replace files|File Operation Progress)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = float, class:^(eog|feh|imv|mpv|vlc)$
windowrule = center, class:^(eog|feh|imv|mpv|vlc)$

layerrule = dim_around, walker

# ── Workspace Rules ───────────────────────────────────────────
workspace = 1,  monitor:eDP-1, default:true
workspace = 2,  monitor:eDP-1
workspace = 3,  monitor:eDP-1
workspace = 4,  monitor:eDP-1
workspace = 5,  monitor:eDP-1
workspace = 6,  monitor:eDP-1
workspace = 7,  monitor:eDP-1
workspace = 8,  monitor:eDP-1
workspace = 9,  monitor:eDP-1
workspace = 10, monitor:eDP-1

workspace = 11, monitor:HDMI-A-2, default:true
workspace = 12, monitor:HDMI-A-2
workspace = 13, monitor:HDMI-A-2
workspace = 14, monitor:HDMI-A-2
workspace = 15, monitor:HDMI-A-2
workspace = 16, monitor:HDMI-A-2
workspace = 17, monitor:HDMI-A-2
workspace = 18, monitor:HDMI-A-2
workspace = 19, monitor:HDMI-A-2
workspace = 20, monitor:HDMI-A-2

workspace = w[tv1], gapsout:0, gapsin:0, border:false
workspace = f[1],   gapsout:0, gapsin:0, border:false

workspace = special:dev_scratch, on-created-empty:uwsm app -- kitty
workspace = special:magic, on-created-empty:uwsm app -- $terminal

# ── Keybindings: Application Launchers ────────────────────────
bind = $mainMod, RETURN,       exec, uwsm app -- $terminal
bind = $mainMod, F,            exec, uwsm app -- $fileManager
bind = $mainMod SHIFT, Y,      exec, kitty -e yazi
bind = $mainMod, B,            exec, uwsm app -- $browser
bind = $mainMod, SPACE,        exec, walker
bind = $mainMod, H,            exec, walker --provider clipboard
bind = $mainMod, O,            exec, obsidian
bind = $mainMod, SLASH,        exec, walker --provider files
bind = $mainMod, PERIOD,       exec, walker --provider symbols
bind = $mainMod, TAB,          exec, walker --provider windows
bind = $mainMod SHIFT, SPACE,  exec, pgrep -x waybar && pkill -USR1 waybar || uwsm app -- waybar
bind = $mainMod SHIFT, Escape, exec, uwsm app -- kitty --class floating_btop -e btop

# ── Keybindings: Web Applications ─────────────────────────────
bind = SUPER SHIFT, B,  exec, uwsm app -- google-chrome-stable
bind = SUPER, R,        exec, uwsm app -- $browser --new-window --app="https://grok.com"
bind = SUPER, C,        exec, uwsm app -- $browser --new-window --app="https://chat.openai.com/"
bind = SUPER, D,        exec, uwsm app -- $browser --new-window --app="https://chat.deepseek.com"
bind = SUPER, Y,        exec, uwsm app -- $browser --new-window --app="https://www.youtube.com/"
bind = SUPER, W,        exec, uwsm app -- $browser --new-window --app="https://web.whatsapp.com"
bind = SUPER, E,        exec, uwsm app -- $browser --new-window --app="https://mail.google.com"
bind = SUPER, P,        exec, uwsm app -- $browser --new-window --app="https://student.brototype.com"
bind = SUPER, K,        exec, uwsm app -- $browser --new-window --app="https://claude.ai/"
bind = SUPER, G,        exec, uwsm app -- $browser --new-window --app="https://gemini.google.com/"
bind = SUPER, A,        exec, uwsm app -- $browser --new-window --app="https://poe.com/"
bind = SUPER, U,        exec, uwsm app -- $browser --new-window --app="https://www.perplexity.ai/"
bind = SUPER SHIFT, G,  exec, uwsm app -- $browser --new-window --app="https://github.com/rashidnarikkodan"
bind = SUPER SHIFT, H,  exec, uwsm app -- $browser --new-window --app="https://hoppscotch.io"
bind = SUPER SHIFT, D,  exec, uwsm app -- $browser --new-window --app="https://discord.com/channels/@me"
bind = SUPER SHIFT, X,  exec, uwsm app -- $browser --new-window --app="https://x.com/home"
bind = SUPER SHIFT, L,  exec, uwsm app -- $browser --new-window --app="https://linkedin.com/in/rashidnarikkodan"
bind = SUPER SHIFT, F,  exec, uwsm app -- $browser --new-window --app="https://www.figma.com/design/DjUV8IojESAPyGEeGZp4Gl/WashQueue?node-id=0-1&p=f&t=UEpeBQ543vhAXJYH-0"
bind = SUPER SHIFT, E,  exec, uwsm app -- $browser --new-window --app="https://app.eraser.io/workspace/pj9mJ1YwHbjL9x6yheFW"
bind = SUPER SHIFT, P,  exec, uwsm app -- $browser --new-window --app="https://altimetry-geologist-93298022-6358717.postman.co/workspace/My-Workspace~58f52ad7-0015-4961-90f7-9cf7d9be564f/collection/47086432-040ad9d0-f72a-460d-a0ed-8e728a51375a?sideView=variables&action_performed=google_login&authFlowId=2809349a-6924-4a42-96fe-149b6a3bfdd0"
bind = SUPER SHIFT, O,  exec, uwsm app -- $browser --new-window --app="https://cloud.mongodb.com"

# ── Keybindings: Window Controls & Navigation ────────────────
bind = $mainMod, Q,            killactive,
bind = CTRL SHIFT, W,          exec, :
bind = $mainMod CTRL SHIFT, W, exec, :
bind = $mainMod, M,            exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, V,            togglefloating,
bind = $mainMod SHIFT, RETURN, fullscreen, 0
bind = $mainMod, T,            pseudo

# Focus Navigation
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = SUPER ALT, H,    movefocus, l
bind = SUPER ALT, J,    movefocus, d
bind = SUPER ALT, K,    movefocus, u
bind = SUPER ALT, L,    movefocus, r

# Window Movement
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Grouping
bind = $mainMod SHIFT, T,  togglegroup
bind = ALT, Tab,           changegroupactive, f
bind = ALT SHIFT, Tab,     changegroupactive, b

# Mouse Controls
bind  = $mainMod, mouse_down, workspace, e+1
bind  = $mainMod, mouse_up,   workspace, e-1
bindm = $mainMod, mouse:272,  movewindow
bindm = $mainMod, mouse:273,  resizewindow

# ── Keybindings: Workspace Switching & Movement ───────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, Grave,       togglespecialworkspace, dev_scratch
bind = $mainMod SHIFT, Grave, movetoworkspace, special:dev_scratch
bind = SUPER, S,              togglespecialworkspace, magic
bind = SUPER SHIFT, S,        movetoworkspace, special:magic
bind = $mainMod, Tab,         workspace, e+1
bind = $mainMod SHIFT, Tab,   workspace, e-1

# ── Keybindings: Window Resizing ─────────────────────────────
binde = $mainMod ALT, left,  resizeactive, -30 0
binde = $mainMod ALT, right, resizeactive,  30 0
binde = $mainMod ALT, up,    resizeactive,  0 -30
binde = $mainMod ALT, down,  resizeactive,  0  30

# ── Keybindings: Screenshots ──────────────────────────────────
bind = , Print,            exec, sh -c 'DIR=~/Pictures/Screenshots/$(date +%Y-%m-%d) && mkdir -p "$DIR" && hyprshot -m output -o "$DIR" -f full_$(date +%H%M%S).png'
bind = SUPER, Print,       exec, sh -c 'DIR=~/Pictures/Screenshots/$(date +%Y-%m-%d) && mkdir -p "$DIR" && hyprshot -m window -o "$DIR" -f window_$(date +%H%M%S).png'
bind = SUPER SHIFT, Print, exec, sh -c 'DIR=~/Pictures/Screenshots/$(date +%Y-%m-%d) && mkdir -p "$DIR" && hyprshot -m region -o "$DIR" -f region_$(date +%H%M%S).png'

# ── Keybindings: Media & Hardware Controls ───────────────────
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 1%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 1%-
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPause,        exec, playerctl play-pause
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioPrev,         exec, playerctl previous
bind   = $mainMod SHIFT, M,       exec, uwsm app -- kitty --class floating_wiremix -e wiremix
