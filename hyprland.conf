# ──────────────────────────────────────────────────────────────
#  Hyprland Configuration  |  https://wiki.hypr.land/
#  Single-file, low-RAM optimized setup
# ──────────────────────────────────────────────────────────────

# ── Variables ─────────────────────────────────────────────────
$mainMod  = SUPER
$terminal = kitty
$fileManager = thunar
$browser  = helium-browser
$launcher = fuzzel
$menu     = $launcher
$editor   = nano

# ── Colors ────────────────────────────────────────────────────
$active_border_color_1  = rgba(A15965ee)
$active_border_color_2  = rgba(B47D78ee)
$inactive_border_color  = rgba(A1596533)

# ── Environment Variables ─────────────────────────────────────
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,14
env = HYPRCURSOR_SIZE,14
env = PATH,$HOME/.local/bin:/usr/local/bin:/usr/bin
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
env = HYPRLAND_LOG_WLR,0
env = LIBVA_DRIVER_NAME,iHD

# ── Monitors ──────────────────────────────────────────────────
monitor = eDP-1,preferred,auto,1
monitor = HDMI-A-2,preferred,auto,1

# ── Input ─────────────────────────────────────────────────────
input {
    kb_layout    = us
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll = true
        tap-to-click   = true
    }
}

gesture = 3, horizontal, workspace

device {
    name        = epic-mouse-v1
    sensitivity = -0.5
}

# ── General Appearance ────────────────────────────────────────
general {
    gaps_in  = 2
    gaps_out = 2
    border_size = 1

    col.active_border   = $active_border_color_1 $active_border_color_2 45deg
    col.inactive_border = $inactive_border_color

    resize_on_border        = true
    extend_border_grab_area = 8
    hover_icon_on_border    = true
    allow_tearing           = false
    layout = dwindle
}

# ── Decorations (RAM-optimized) ───────────────────────────────
decoration {
    rounding = 10

    active_opacity   = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    dim_inactive = false

    blur {
        enabled           = true
        size              = 4
        passes            = 1
        new_optimizations = true
        xray              = false
        ignore_opacity    = false
        vibrancy          = 0
        popups            = false
    }

    shadow {
        enabled = false
    }
}

# ── Animations ────────────────────────────────────────────────
animations {
    enabled = true

    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = smooth,  0.25, 1, 0.5, 1

    animation = windows,          1, 3, easeOut, slide
    animation = windowsIn,        1, 3, easeOut, popin 85%
    animation = windowsOut,       1, 2, smooth,  popin 85%
    animation = windowsMove,      1, 3, easeOut, slide
    animation = border,           1, 3, default
    animation = fade,             1, 2, default
    animation = workspaces,       1, 3, easeOut, slide
    animation = specialWorkspace, 1, 3, easeOut, slidefadevert 20%
}

# ── Layout ────────────────────────────────────────────────────
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# ── Misc ──────────────────────────────────────────────────────
misc {
    force_default_wallpaper      = 0
    disable_hyprland_logo        = true
    disable_splash_rendering     = true
    vrr                          = 1
    mouse_move_enables_dpms      = true
    key_press_enables_dpms       = true
    always_follow_on_dnd         = true
    animate_manual_resizes       = false
    animate_mouse_windowdragging = false
    enable_swallow               = true
    swallow_regex                = ^(alacritty|kitty|foot|ghostty)$
    focus_on_activate            = true
    initial_workspace_tracking   = 1
}

cursor {
    no_hardware_cursors      = false
    hide_on_key_press        = true
    warp_on_change_workspace = true
}

# ── Render ────────────────────────────────────────────────────
render {
    direct_scanout = 1
}

# ── Autostart ─────────────────────────────────────────────────
exec-once = uwsm app -- waybar
exec-once = uwsm app -- hyprpaper
exec-once = uwsm app -- wl-paste --type text  --watch cliphist store
exec-once = uwsm app -- wl-paste --type image --watch cliphist store

# ── Window Rules ──────────────────────────────────────────────
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class      = ^$
    match:title      = ^$
    match:xwayland   = true
    match:float      = true
    match:fullscreen = false
    match:pin        = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move  = 20 monitor_h-120
    float = yes
}

windowrule {
    name = float-btop
    match:class = ^(floating_btop)$
    float  = yes
    size   = 1000 650
    center = yes
}

windowrule {
    name = float-system-dialogs
    match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nwg-look|qt5ct|qt6ct|nm-connection-editor|nm-applet)$
    float  = yes
    center = yes
}

windowrule {
    name = float-file-dialogs
    match:title = ^(Open File|Select a File|Choose Files|Save As|Save File|Confirm to replace files|File Operation Progress)$
    float  = yes
    center = yes
}

# ── Workspace Rules ───────────────────────────────────────────
workspace = w[tv1], gapsout:0, gapsin:0, border:false
workspace = f[1],   gapsout:0, gapsin:0, border:false
workspace = special:dev_scratch, on-created-empty:uwsm app -- kitty

# ── Keybinds: Applications ────────────────────────────────────
bind = $mainMod, RETURN,       exec, uwsm app -- $terminal
bind = $mainMod, F,            exec, uwsm app -- $fileManager
bind = $mainMod, B,            exec, uwsm app -- $browser
bind = $mainMod, SPACE,        exec, pkill -x fuzzel || uwsm app -- $menu
bind = $mainMod SHIFT, SPACE,  exec, pgrep -x waybar && pkill -USR1 waybar || uwsm app -- waybar
bind = $mainMod SHIFT, Escape, exec, uwsm app -- kitty --class floating_btop -e btop
bind = $mainMod, H,            exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = $mainMod SHIFT, W,      exec, ~/.config/hypr/scripts/wallpaper.sh
bind = $mainMod CTRL,  W,      exec, ~/.config/hypr/scripts/wallpaper.sh --next
bind = $mainMod ALT,   W,      exec, ~/.config/hypr/scripts/wallpaper.sh --toggle-daemon

bind = SUPER SHIFT, B,  exec, uwsm app -- brave
bind = SUPER, R,        exec, uwsm app -- helium-browser --new-window --app="https://grok.com"
bind = SUPER, C,        exec, uwsm app -- helium-browser --new-window --app="https://chat.openai.com/"
bind = SUPER, D,        exec, uwsm app -- helium-browser --new-window --app="https://chat.deepseek.com"
bind = SUPER, Y,        exec, uwsm app -- helium-browser --new-window --app="https://www.youtube.com/"
bind = SUPER, W,        exec, uwsm app -- helium-browser --new-window --app="https://web.whatsapp.com"
bind = SUPER, E,        exec, uwsm app -- helium-browser --new-window --app="https://mail.google.com"
bind = SUPER, P,        exec, uwsm app -- helium-browser --new-window --app="https://student.brototype.com"
bind = SUPER, K,        exec, uwsm app -- helium-browser --new-window --app="https://claude.ai/"
bind = SUPER, G,        exec, uwsm app -- helium-browser --new-window --app="https://gemini.google.com/"
bind = SUPER, A,        exec, uwsm app -- helium-browser --new-window --app="https://poe.com/"
bind = SUPER, U,        exec, uwsm app -- helium-browser --new-window --app="https://www.perplexity.ai/"
bind = SUPER SHIFT, G,  exec, uwsm app -- helium-browser --new-window --app="https://github.com/rashidnarikkodan"
bind = SUPER, O,        exec, uwsm app -- helium-browser --new-window --app="https://www.blackbox.ai"
bind = SUPER SHIFT, H,  exec, uwsm app -- helium-browser --new-window --app="https://hoppscotch.io"
bind = SUPER SHIFT, D,  exec, uwsm app -- helium-browser --new-window --app="https://discord.com/channels/@me"
bind = SUPER SHIFT, X,  exec, uwsm app -- helium-browser --new-window --app="https://x.com/home"
bind = SUPER SHIFT, L,  exec, uwsm app -- helium-browser --new-window --app="https://linkedin.com/in/rashidnarikkodan"
bind = SUPER SHIFT, F,  exec, uwsm app -- helium-browser --new-window --app="https://www.figma.com/design/DjUV8IojESAPyGEeGZp4Gl/WashQueue?node-id=0-1&p=f&t=UEpeBQ543vhAXJYH-0"
bind = SUPER SHIFT, E,  exec, uwsm app -- helium-browser --new-window --app="https://app.eraser.io/workspace/pj9mJ1YwHbjL9x6yheFW"
bind = SUPER SHIFT, P,  exec, uwsm app -- helium-browser --new-window --app="https://altimetry-geologist-93298022-6358717.postman.co/workspace/My-Workspace~58f52ad7-0015-4961-90f7-9cf7d9be564f/collection/47086432-040ad9d0-f72a-460d-a0ed-8e728a51375a?sideView=variables&action_performed=google_login&authFlowId=2809349a-6924-4a42-96fe-149b6a3bfdd0"
bind = SUPER SHIFT, O,  exec, uwsm app -- helium-browser --new-window --app="https://cloud.mongodb.com"

# ── Keybinds: Window Management ───────────────────────────────
bind = $mainMod, Q,            killactive,
bind = $mainMod, M,            exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, V,            togglefloating,
bind = $mainMod SHIFT, RETURN, fullscreen, 0
bind = $mainMod, T,            pseudo

bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

bind = SUPER ALT, H, movefocus, l
bind = SUPER ALT, J, movefocus, d
bind = SUPER ALT, K, movefocus, u
bind = SUPER ALT, L, movefocus, r

bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

bind = $mainMod SHIFT, T, togglegroup
bind = ALT, Tab,           changegroupactive, f
bind = ALT SHIFT, Tab,     changegroupactive, b

# ── Keybinds: Resize ──────────────────────────────────────────
binde = $mainMod ALT, left,  resizeactive, -30 0
binde = $mainMod ALT, right, resizeactive,  30 0
binde = $mainMod ALT, up,    resizeactive,  0 -30
binde = $mainMod ALT, down,  resizeactive,  0  30

# ── Keybinds: Mouse ───────────────────────────────────────────
bind  = $mainMod, mouse_down, workspace, e+1
bind  = $mainMod, mouse_up,   workspace, e-1
bindm = $mainMod, mouse:272,  movewindow
bindm = $mainMod, mouse:273,  resizewindow

# ── Keybinds: Workspaces ──────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, Grave,       togglespecialworkspace, dev_scratch
bind = $mainMod SHIFT, Grave, movetoworkspace, special:dev_scratch
bind = SUPER, S,              togglespecialworkspace, magic
bind = SUPER SHIFT, S,        movetoworkspace, special:magic
bind = $mainMod, Tab,         workspace, e+1
bind = $mainMod SHIFT, Tab,   workspace, e-1

# ── Keybinds: Media & System ──────────────────────────────────
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 1%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 1%-
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPause,        exec, playerctl play-pause
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioPrev,         exec, playerctl previous

# ── Keybinds: Screenshots ─────────────────────────────────────
bind = , Print,            exec, sh -c 'DIR=~/Pictures/Screenshots/$(date +%Y-%m-%d) && mkdir -p "$DIR" && hyprshot -m output -o "$DIR" -f full_$(date +%H%M%S).png'
bind = SUPER, Print,       exec, sh -c 'DIR=~/Pictures/Screenshots/$(date +%Y-%m-%d) && mkdir -p "$DIR" && hyprshot -m window -o "$DIR" -f window_$(date +%H%M%S).png'
bind = SUPER SHIFT, Print, exec, sh -c 'DIR=~/Pictures/Screenshots/$(date +%Y-%m-%d) && mkdir -p "$DIR" && hyprshot -m region -o "$DIR" -f region_$(date +%H%M%S).png'
