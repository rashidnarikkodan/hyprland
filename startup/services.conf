# Autostart Services
# Executed once at Hyprland launch for background services and tools
# Managed via UWSM (Universal Wayland Session Manager) scopes for proper systemd integration

exec-once = uwsm app -- waybar
exec-once = uwsm app -- hyprpaper

# Clipboard History Daemon (stores text and image copies)
exec-once = uwsm app -- wl-paste --type text --watch cliphist store
exec-once = uwsm app -- wl-paste --type image --watch cliphist store
