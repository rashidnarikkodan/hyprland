# Application Binds
# Keybindings for launching apps and tools
# Graphical applications are wrapped in 'uwsm app --' for systemd process tracking

bind = $mainMod, RETURN, exec, uwsm app -- $terminal
bind = $mainMod, F, exec, uwsm app -- $fileManager
bind = $mainMod, B, exec, uwsm app -- $browser
bind = $mainMod, SPACE, exec, pkill -x wofi || uwsm app -- $menu
bind = $mainMod SHIFT, SPACE, exec, pgrep -x waybar && pkill -USR1 waybar || uwsm app -- waybar

# Floating btop Resource Monitor
bind = $mainMod SHIFT, Escape, exec, uwsm app -- kitty --class floating_btop -e btop

# Web Applications (Brave App Shortcuts & Firefox)
bind = SUPER SHIFT, B, exec, uwsm app -- firefox
bind = SUPER, R, exec, uwsm app -- brave --new-window --app="https://grok.com"
