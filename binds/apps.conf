# Clipboard History Bind (calls wofi fuzzy menu)
bind = $mainMod, H, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Wallpaper Controls
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper.sh
bind = $mainMod CTRL, W, exec, ~/.config/hypr/scripts/wallpaper.sh --next
bind = $mainMod ALT, W, exec, ~/.config/hypr/scripts/wallpaper.sh --toggle-daemon
